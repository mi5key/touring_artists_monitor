jobs:
  scan:
    runs-on: ubuntu-latest
    environment: prod  # CRITICAL: Must match your secret environment name
    
    # MOVED env HERE (Job level)
    env:
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Secret Presence
        run: |
          if [ -z "$NOTIFY_WEBHOOK_URL" ]; then echo "URL MISSING"; exit 1; fi
          echo "All secrets loaded at Job level."

      - name: Install Dependencies
        run: |
          pip install playwright google-genai requests
          playwright install chromium

      - name: Run Scanner
        run: python main.py # Now has access to env vars automatically
